<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rancho Doble — Datos de pago</title>
<link rel="stylesheet" href="_base.css">
<style>
  .pieza { width: 1080px; height: 1440px; padding: 78px 70px; justify-content: space-between; }
  .centro { flex: 1 1 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 84px; }

  .cabecera { text-align: center; }
  .marca { font-size: 78px; }
  .cabecera .regla { margin-top: 22px; }
  .cabecera .regla i { width: 150px; }

  .bloque-titulo { text-align: center; }
  .estrella { color: var(--beige); font-size: 40px; line-height: 1; margin-bottom: 26px; }
  .titulo-chico { font-size: 84px; }
  .titulo-grande { font-size: 232px; margin-top: 6px; }

  .bajada {
    margin-top: 38px;
    font-weight: 700;
    font-size: 33px;
    letter-spacing: 0.10em;
    text-indent: 0.10em;
    line-height: 1.5;
    text-align: center;
  }
  .bajada em { font-style: normal; color: var(--beige); }
  .bajada .regla { margin-bottom: 18px; }
  .bajada .regla i { width: 110px; }

  .caja {
    border: 3px solid var(--beige);
    border-radius: 34px;
    padding: 40px 46px;
    width: 100%;
  }
  .caja-fila { display: flex; align-items: center; gap: 40px; }
  .banco {
    flex: 0 0 auto;
    width: 168px; height: 168px;
    border-radius: 50%;
    background: var(--crema);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--verde);
  }
  .banco svg { display: block; }
  .banco span {
    font-weight: 700; font-size: 26px;
    letter-spacing: 0.10em; text-indent: 0.10em;
    margin-top: 8px;
  }
  .separador { flex: 0 0 auto; width: 2px; align-self: stretch; background: rgba(185,167,148,.45); }
  .cuenta { flex: 1 1 auto; text-align: center; }
  .cuenta-rotulo {
    font-weight: 400; font-size: 32px;
    letter-spacing: 0.10em; text-indent: 0.10em;
    color: var(--crema);
  }
  .cuenta-numero {
    font-weight: 700; font-size: 96px;
    letter-spacing: 0.03em; text-indent: 0.03em;
    line-height: 1.05; margin-top: 6px;
  }
  .caja hr { border: 0; border-top: 2px solid rgba(185,167,148,.45); margin: 30px 0 26px; }
  .destinatario { text-align: center; font-size: 31px; }
  .destinatario b {
    font-weight: 700; color: var(--beige);
    letter-spacing: 0.10em;
  }
  .destinatario span {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--crema); font-size: 36px; margin-left: 10px;
  }

  .pie { font-size: 30px; }
  .pie svg { display: block; }
</style>
</head>
<body>
<div class="pieza">
  <div class="franja franja--arriba"></div>
  <div class="franja franja--abajo"></div>

  <div class="cabecera">
    <p class="marca">Rancho Doble</p>
    <div class="regla"><i></i><span class="rombo">&#10022;</span><i></i></div>
  </div>

  <div class="centro">
  <div class="bloque-titulo">
    <div class="estrella">&#10022;</div>
    <p class="titulo-chico">Datos de</p>
    <p class="titulo-grande textura">Pago</p>
    <div class="bajada">
      <div class="regla"><i></i><span class="rombo">&#10022;</span><i></i></div>
      Podés realizar tu pago<br>por <em>transferencia</em>
    </div>
  </div>

  <div class="caja">
    <div class="caja-fila">
      <div class="banco">
        <svg width="74" height="60" viewBox="0 0 74 60" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22 37 5l33 17"/>
          <path d="M11 22v26M26 22v26M48 22v26M63 22v26"/>
          <path d="M4 55h66"/>
        </svg>
        <span>Ita&uacute;</span>
      </div>
      <div class="separador"></div>
      <div class="cuenta">
        <div class="cuenta-rotulo">N&uacute;mero de cuenta Ita&uacute;</div>
        <div class="cuenta-numero">2613150</div>
      </div>
    </div>
    <hr>
    <div class="destinatario">
      <b>Nombre destinatario:</b><span>Luciano Uraga</span>
    </div>
  </div>
  </div>

  <div class="pie">
    <span class="rombo">&#10022;</span>
    <svg width="30" height="27" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20S2.5 13.5 2.5 7.5A5 5 0 0 1 12 5a5 5 0 0 1 9.5 2.5C21.5 13.5 12 20 12 20z"/></svg>
    <span>&iexcl;Gracias por elegirnos!</span>
    <svg width="30" height="27" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20S2.5 13.5 2.5 7.5A5 5 0 0 1 12 5a5 5 0 0 1 9.5 2.5C21.5 13.5 12 20 12 20z"/></svg>
    <span class="rombo">&#10022;</span>
  </div>
</div>
</body>
</html>
