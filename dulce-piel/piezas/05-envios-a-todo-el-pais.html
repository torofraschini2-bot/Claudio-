<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Dulce Piel — Envíos a todo el país (historia)</title>
<link rel="stylesheet" href="../marca.css">
<style>
  .pieza { color: var(--dp-crema); }
  .contenido {
    position: absolute; inset: 38px;
    display: flex; flex-direction: column; align-items: center;
    padding: 132px 92px 96px;
    text-align: center;
  }
  .logo-texto { font-size: 40px; color: var(--dp-crema); }

  .titulo { margin-top: 88px; font-size: 112px; color: #fff; }

  .tarjeta {
    margin-top: 96px; width: 100%;
    background: var(--dp-crema-tibia); color: var(--dp-cacao);
    border-radius: 34px; padding: 58px 64px 54px;
    box-shadow: 0 34px 80px rgba(23,15,13,.28);
  }
  .tarjeta .camion { width: 120px; height: 77px; margin: 0 auto; color: var(--dp-rosa); }
  .plazo {
    margin-top: 34px; font-size: 58px; font-weight: 700;
    letter-spacing: .05em; text-indent: .05em; text-transform: uppercase;
    color: var(--dp-rosa);
  }
  .separador { height: 1px; background: rgba(46,30,25,.18); margin: 36px 0 32px; }
  .via  { font-size: 30px; color: rgba(46,30,25,.62); }
  .medios { margin-top: 12px; font-size: 56px; font-weight: 700; letter-spacing: .04em; }

  .promesa   { margin-top: 88px; font-size: 52px; font-weight: 700;
               letter-spacing: .045em; text-indent: .045em; text-transform: uppercase; }
  .promesa-2 { margin-top: 16px; font-size: 38px; font-weight: 300; color: var(--dp-nude); }

  .pie { margin-top: auto; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .pie .dp-filete { width: 520px; margin-bottom: 52px; }
  .coordinamos { font-size: 31px; color: var(--dp-nude); }
  .pildora-wsp {
    margin-top: 28px; height: 116px; padding: 0 68px; gap: 28px;
    background: var(--dp-crema-tibia); color: var(--dp-rosa);
  }
  .pildora-wsp .ico { width: 62px; height: 62px; }
  .pildora-wsp span { font-size: 54px; font-weight: 700; letter-spacing: .02em; color: var(--dp-cacao); }
</style>

<body>
<div class="dp-lienzo dp-lienzo--historia pieza">
  <div class="dp-fondo-seda"></div>
  <div class="dp-bokeh" style="width:640px;height:640px;right:-200px;top:160px;background:rgba(217,166,149,.30)"></div>
  <div class="dp-bokeh" style="width:560px;height:560px;left:-190px;top:900px;background:rgba(232,203,186,.18)"></div>
  <div class="dp-bokeh" style="width:820px;height:540px;left:120px;bottom:-220px;background:rgba(156,95,81,.35)"></div>
  <div class="dp-vineta"></div>
  <div class="dp-grano"></div>
  <div class="dp-marco"></div>

  <div class="contenido">
    <div class="dp-marca logo-texto">Dulce Piel</div>

    <h1 class="dp-titulo titulo">Envíos a<br>todo el país</h1>

    <div class="tarjeta">
      <i class="camion" data-dp="camion"></i>
      <div class="plazo">24 a 48 horas</div>
      <div class="separador"></div>
      <div class="via dp-microtexto">Enviamos por</div>
      <div class="medios">DAC · CORREO</div>
    </div>

    <div class="promesa">Envío rápido y seguro</div>
    <div class="promesa-2">a todo el país, con seguimiento</div>

    <div class="pie">
      <div class="dp-filete"></div>
      <div class="coordinamos dp-microtexto">Coordinamos por WhatsApp</div>
      <div class="dp-pildora pildora-wsp">
        <i class="ico" data-dp="whatsapp"></i>
        <span>092 722 531</span>
      </div>
    </div>
  </div>
</div>
<script src="../marca.js"></script>
</body>
</html>
